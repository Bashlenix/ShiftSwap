name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shiftswap
          POSTGRES_PASSWORD: shiftswap
          POSTGRES_DB: shiftswap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftswap"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://shiftswap:shiftswap@localhost:5432/shiftswap
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: API database tests
        run: npm run test:e2e -w @shiftswap/api
      - run: npm audit --audit-level=critical
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stack-smoke:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-check helpers self-test
        run: scripts/test-smoke-checks.sh
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: scripts/smoke-stack.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs api web db
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  zero-setup:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: shiftswap-devcontainer
      COMPOSE_FILES: -f docker-compose.yml -f .devcontainer/docker-compose.devcontainer.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install test tooling
        run: npm ci --ignore-scripts
      - name: Start the dev container (same path as a Codespace)
        run: npx --yes @devcontainers/cli up --workspace-folder .
      - name: Wait for the login page
        run: npx --yes wait-on -t 300000 http-get://localhost:5173/login
      - name: Smoke test
        run: scripts/smoke-stack.sh
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (login, accessibility)
        run: npx playwright test -c e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Show logs on failure
        if: failure()
        run: |
          docker ps -a
          docker compose $COMPOSE_FILES logs
      - name: Stop the stack
        if: always()
        run: docker compose $COMPOSE_FILES down -v
