name: CI

on:
  push:
  workflow_dispatch:

jobs:
  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: DEBUG build api
        run: |
          docker build -f apps/api/Dockerfile -t dbg-api . -q
          docker run --rm --entrypoint sh dbg-api -c 'ls /app /app/node_modules | head -30; ls /app/node_modules/@nestjs; ls -la /app/apps/api'
          docker build -f apps/api/Dockerfile --target build -t dbg-build . -q
          docker run --rm --entrypoint sh dbg-build -c 'ls /app/node_modules | wc -l; ls /app/node_modules/@nestjs'
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: scripts/smoke-stack.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs api web db
      - name: Stop the stack
        if: always()
        run: docker compose down -v
