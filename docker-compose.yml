services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shiftswap
      POSTGRES_PASSWORD: shiftswap
      POSTGRES_DB: shiftswap
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shiftswap']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
